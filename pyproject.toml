[project]
name = "switchboard"
version = "0.2.0"
description = "Switchboard - local-first personal autonomy layer for compatible AI agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "mcp>=1.9",
  "pydantic>=2.7",
  "meta-sam-parser>=0.0.4",
]

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["switchboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
